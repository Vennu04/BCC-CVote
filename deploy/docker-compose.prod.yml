# PROD — single free-tier EC2 instance (new AWS account, no K3s/ArgoCD)
# Deployed/refreshed by deploy.sh (baked onto the instance, re-invoked via
# SSM RunCommand on every CI push). Secrets come from .env, generated by
# deploy.sh from SSM Parameter Store at deploy time — never committed.
#
# Usage on the instance:
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

services:
  caddy:
    image: caddy:2-alpine
    container_name: bcc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    mem_limit: 80m

  backend:
    image: ${ECR_REGISTRY}/bcc-cvote-backend:latest
    container_name: bcc-backend
    restart: unless-stopped
    mem_limit: 300m
    environment:
      FLASK_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: https://${APP_HOSTNAME}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      GUNICORN_WORKERS: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: ${ECR_REGISTRY}/bcc-cvote-frontend:latest
    container_name: bcc-frontend
    restart: unless-stopped
    mem_limit: 100m
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
