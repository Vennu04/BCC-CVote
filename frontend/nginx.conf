server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets at the origin — the base nginx:alpine image ships
    # with gzip off by default. gzip_proxied defaults to "off" for proxied
    # responses specifically (nginx is conservative about compressing
    # upstream content by default) — set explicitly here so the /api/ JSON
    # responses below get compressed too, not just the static JS/CSS bundle.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript application/xml text/xml image/svg+xml
        application/manifest+json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # This pod only ever listens on plain HTTP -- TLS terminates upstream at
    # the Traefik ingress (see k8s/prod/ingress.yaml), whose plain-HTTP entry
    # 301s to HTTPS before ever reaching here. So every response leaving this
    # container has, in practice, already been served over HTTPS -- safe to
    # unconditionally add HSTS here rather than needing scheme detection.
    # max-age is intentionally short (1 day, not the usual 1-year default):
    # cert-manager is currently down cluster-wide (a known, separate issue),
    # so TLS cert renewal is at real risk of failing -- a long max-age would
    # make the app unreachable in every browser that already visited, for as
    # long as that max-age lasts, if the cert ever actually expires. Raise
    # this once cert-manager's health is confirmed restored.
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    # CSP: everything this SPA loads is same-origin (verified — no external
    # script/style/font/image hosts anywhere in the codebase), so default-src
    # 'self' covers almost everything. style-src needs 'unsafe-inline' for
    # the handful of React inline style={{...}} usages (background-image,
    # progress-bar widths) — none of it renders unescaped user input, so the
    # actual risk 'unsafe-inline' reopens here is low. connect-src
    # pre-allows Sentry's ingest domain for when SENTRY_DSN/VITE_SENTRY_DSN
    # get configured (see the observability TODO) — no functional effect
    # until then, avoids a second CSP fix later.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.sentry.io; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Proxy API calls to backend service (K8s service name: backend)
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA fallback — all unknown routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health probe for Docker HEALTHCHECK
    location = /health.txt {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Service worker / PWA manifest must always be revalidated, never long-cached,
    # or installed devices never see updates.
    location ~* \.(webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets (hashed filenames are safe to cache immutably)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
