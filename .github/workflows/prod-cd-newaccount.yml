name: Prod CD (New Account)

# The only prod deploy workflow — the old K3s stack + its prod-cd.yml were
# decommissioned 2026-08-18 once the old AWS account (661474704151) ran out
# of free-tier credits. See INFRASTRUCTURE.md for the full architecture and
# terraform/main.tf's header comment for the decommission record. The name
# "(New Account)" is kept for continuity with existing GitHub environment/
# secret naming (NEW_AWS_DEPLOY_ROLE_ARN, NEW_INSTANCE_ID) rather than a
# functional distinction — there's no "old account" deploy anymore.

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "642195693540"
  ECR_REGISTRY: 642195693540.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPO: bcc-cvote-backend
  FRONTEND_REPO: bcc-cvote-frontend
  # Free DuckDNS domain pointed at the instance's EIP — replaced the
  # sslip.io URL 2026-09-02 when CloudFront (d2welg0wjdnhjp.cloudfront.net,
  # old account) was retired in favor of this domain going straight to the
  # instance. Caddy only serves this hostname now (see deploy/deploy.sh's
  # APP_HOSTNAME override via /bcc-cvote/prod/app-hostname), so the old
  # sslip.io URL no longer resolves to a valid cert.
  APP_URL: https://bcccvote.duckdns.org

# How a deploy works (2026-10-15/16):
# - Every image is fingerprinted by the git tree hash of its folder and
#   tagged tree-<hash>. PR checks (dev-ci.yml) already build + scan the
#   images into the *-ci repos, so on merge the usual case is "copy the
#   PR's image" instead of building again; only source nobody has built
#   yet is built here (see .github/scripts/plan-images.sh).
# - Tests run side by side with build/copy; deploy needs all of them, and
#   only the deploy job moves `latest` (what the server pulls).
# - One deploy at a time, newest commit only.
jobs:
  plan:
    name: Plan (build, copy or reuse)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      builds: ${{ steps.plan.outputs.builds }}
      copy: ${{ steps.plan.outputs.copy }}
      deploy: ${{ steps.plan.outputs.deploy }}
      tag_backend: ${{ steps.plan.outputs.tag_backend }}
      tag_frontend: ${{ steps.plan.outputs.tag_frontend }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, new account)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.NEW_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Compare with prod and with PR builds
        id: plan
        run: bash .github/scripts/plan-images.sh

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend test suite
        working-directory: backend
        env:
          FLASK_ENV: testing
        run: python -m pytest tests/ -q

  build-and-push:
    name: Build, Scan & Push (${{ matrix.image }})
    needs: plan
    if: needs.plan.outputs.builds != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, new account)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.NEW_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Must match dev-ci.yml's PR build exactly (context, build args), so a
      # tree-<hash> image is the same whichever pipeline built it.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          load: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:${{ matrix.tag }}
          build-args: |
            VITE_API_URL=
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:${{ matrix.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # Pushed only after the scan passed. Not `latest` — the deploy job
      # moves that once tests have passed too.
      - name: Push to ECR
        run: docker push "${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:${{ matrix.tag }}"

  copy-pr-images:
    name: Reuse PR-built images
    needs: plan
    if: needs.plan.outputs.copy != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC, new account)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.NEW_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: imjasonh/setup-crane@v0.7

      # Registry-to-registry copy of the exact image the PR check built and
      # scanned (same digest), from bcc-cvote-<image>-ci into the prod repo.
      - name: Copy into the prod repositories
        env:
          TAG_BACKEND: ${{ needs.plan.outputs.tag_backend }}
          TAG_FRONTEND: ${{ needs.plan.outputs.tag_frontend }}
        run: |
          for IMG in ${{ needs.plan.outputs.copy }}; do
            if [ "$IMG" = backend ]; then TAG=$TAG_BACKEND; else TAG=$TAG_FRONTEND; fi
            crane copy "${{ env.ECR_REGISTRY }}/bcc-cvote-$IMG-ci:$TAG" "${{ env.ECR_REGISTRY }}/bcc-cvote-$IMG:$TAG"
            echo "bcc-cvote-$IMG:$TAG copied from the PR build"
          done

  deploy:
    name: Deploy (SSM RunCommand)
    needs: [plan, backend-tests, build-and-push, copy-pr-images]
    # build/copy are skipped when there is nothing to build/copy; still finish cleanly.
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.backend-tests.result == 'success'
      && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
      && (needs.copy-pr-images.result == 'success' || needs.copy-pr-images.result == 'skipped')
    runs-on: ubuntu-latest

    # One deploy at a time. If several merges queue up, GitHub keeps only the
    # newest waiting run; the check below also skips any run whose commit is
    # no longer the head of main, so an older build can never land after a
    # newer one.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false

    environment:
      name: production-newaccount
      url: ${{ env.APP_URL }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Skip if a newer commit is already on main
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to ${HEAD_SHA::8} — skipping this deploy; the newer run deploys instead."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ needs.plan.outputs.deploy }}" ]; then
            echo "::notice::Prod already runs this exact backend/ and frontend/ code — nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC, new account)
        if: steps.fresh.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.NEW_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The server pulls `:latest`; point it at this commit's tested images
      # (same digest as tree-<hash>), and leave a commit tag for history.
      - name: Promote to latest
        if: steps.fresh.outputs.deploy == 'true'
        env:
          TAG_BACKEND: ${{ needs.plan.outputs.tag_backend }}
          TAG_FRONTEND: ${{ needs.plan.outputs.tag_frontend }}
        run: |
          for IMG in ${{ needs.plan.outputs.deploy }}; do
            REPO="bcc-cvote-$IMG"
            if [ "$IMG" = backend ]; then TAG=$TAG_BACKEND; else TAG=$TAG_FRONTEND; fi
            RESP=$(aws ecr batch-get-image --repository-name "$REPO" \
              --image-ids imageTag="$TAG" --region ${{ env.AWS_REGION }} --output json)
            MEDIA_TYPE=$(echo "$RESP" | jq -r '.images[0].imageManifestMediaType // empty')
            MANIFEST=$(echo "$RESP" | jq -r '.images[0].imageManifest // empty')
            if [ -z "$MANIFEST" ]; then
              echo "::error::No $REPO image tagged $TAG"; exit 1
            fi
            for T in latest "${GITHUB_SHA::8}"; do
              OUT=$(aws ecr put-image --repository-name "$REPO" --image-tag "$T" \
                --image-manifest "$MANIFEST" --image-manifest-media-type "$MEDIA_TYPE" \
                --region ${{ env.AWS_REGION }} 2>&1) || {
                  echo "$OUT" | grep -q ImageAlreadyExistsException || { echo "$OUT"; exit 1; }
                }
            done
            echo "$REPO: latest -> $TAG (${GITHUB_SHA::8})"
          done

      - name: Trigger deploy via SSM RunCommand
        if: steps.fresh.outputs.deploy == 'true'
        id: deploy
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.NEW_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/opt/bcc-cvote/deploy.sh"]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

          STATUS=Pending
          for _ in $(seq 1 150); do
            sleep 2
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ secrets.NEW_INSTANCE_ID }}" \
              --region ${{ env.AWS_REGION }} --query Status --output text 2>/dev/null || echo "Pending")
            [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Pending" ] && break
          done

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ secrets.NEW_INSTANCE_ID }}" \
            --region ${{ env.AWS_REGION }} \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy command finished with status $STATUS"
            exit 1
          fi

      - name: Smoke test
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          for _ in $(seq 1 20); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' -m 10 "${{ env.APP_URL }}/" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "smoke test passed ($CODE)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::smoke test failed after retries"
          exit 1
