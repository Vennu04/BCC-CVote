name: Dev CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  security-scan:
    name: Security & Quality Scan
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── Backend ──────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend test suite
        working-directory: backend
        env:
          FLASK_ENV: testing
        run: python -m pytest tests/ -v

      - name: Pip audit (backend)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln GHSA-p5hg-742f-3vxf

      # ── Frontend ─────────────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend test suite
        working-directory: frontend
        run: npm run test

      # audit-level=critical, not high: the one remaining HIGH finding is
      # GHSA-fx2h-pf6j-xcff (vite dev-server path-traversal bypass on
      # Windows) - dev-server-only, never ships in the prod Docker image
      # (nginx serves the static `vite build` output), and its only fix is
      # a breaking 3-major-version jump to vite 8. Accepted for now;
      # revisit as its own dedicated upgrade task. npm audit has no
      # per-advisory ignore flag (unlike pip-audit --ignore-vuln above),
      # so this is the closest equivalent.
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=critical

      # ── Trivy filesystem scan ─────────────────────────────────────────────
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # ── SonarCloud ────────────────────────────────────────────────────────
      # Skipped on Dependabot PRs: GitHub doesn't give them repo secrets, so
      # SONAR_TOKEN is empty there. The scan still runs on main after merge.
      - name: SonarCloud scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Vennu04_BCC-CVote
            -Dsonar.organization=vennu04
            -Dsonar.sources=backend/app,frontend/src
            -Dsonar.python.version=3.12

      # ── Frontend build check ──────────────────────────────────────────────
      - name: Vite build (dev sanity check)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000

  # Build-once: on a PR, build + scan the images now and store them in the
  # *-ci repos under tree-<hash> (the git tree hash of the image's folder).
  # When the PR merges, Prod CD finds the same tree-<hash> and copies this
  # exact image instead of building again. Uses a PR-only AWS role that can
  # push to the *-ci repos and nothing else. Skipped for Dependabot PRs (no
  # secrets) — Prod CD simply builds those on merge.
  pr-images:
    name: Build PR image (${{ matrix.image }})
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    env:
      ECR_REGISTRY: 642195693540.dkr.ecr.ap-south-1.amazonaws.com
    steps:
      - uses: actions/checkout@v7

      - name: Fingerprint
        id: tag
        run: echo "TAG=tree-$(git rev-parse HEAD:${{ matrix.image }} | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (PR builds role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::642195693540:role/bcc-cvote-github-actions-ci
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Already built?
        id: have
        run: |
          D=$(aws ecr batch-get-image --repository-name "bcc-cvote-${{ matrix.image }}-ci" \
            --image-ids imageTag="${{ steps.tag.outputs.TAG }}" --query 'images[0].imageId.imageDigest' --output text 2>/dev/null || echo None)
          if [ "$D" != "None" ]; then echo "built=true" >> "$GITHUB_OUTPUT"; echo "Already built: ${{ steps.tag.outputs.TAG }}"; else echo "built=false" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3
        if: steps.have.outputs.built != 'true'

      # Must match prod-cd-newaccount.yml's build exactly.
      - name: Build image
        if: steps.have.outputs.built != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          load: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/bcc-cvote-${{ matrix.image }}-ci:${{ steps.tag.outputs.TAG }}
          build-args: |
            VITE_API_URL=
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trivy image scan
        if: steps.have.outputs.built != 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/bcc-cvote-${{ matrix.image }}-ci:${{ steps.tag.outputs.TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push PR build
        if: steps.have.outputs.built != 'true'
        run: docker push "${{ env.ECR_REGISTRY }}/bcc-cvote-${{ matrix.image }}-ci:${{ steps.tag.outputs.TAG }}"
