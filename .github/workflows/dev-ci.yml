name: Dev CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  security-scan:
    name: Security & Quality Scan
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Backend ──────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend test suite
        working-directory: backend
        env:
          FLASK_ENV: testing
        run: python -m pytest tests/ -v

      - name: Pip audit (backend)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln GHSA-p5hg-742f-3vxf

      # ── Frontend ─────────────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend test suite
        working-directory: frontend
        run: npm run test

      # audit-level=critical, not high: the one remaining HIGH finding is
      # GHSA-fx2h-pf6j-xcff (vite dev-server path-traversal bypass on
      # Windows) - dev-server-only, never ships in the prod Docker image
      # (nginx serves the static `vite build` output), and its only fix is
      # a breaking 3-major-version jump to vite 8. Accepted for now;
      # revisit as its own dedicated upgrade task. npm audit has no
      # per-advisory ignore flag (unlike pip-audit --ignore-vuln above),
      # so this is the closest equivalent.
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=critical

      # ── Trivy filesystem scan ─────────────────────────────────────────────
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # ── SonarCloud ────────────────────────────────────────────────────────
      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Vennu04_BCC-CVote
            -Dsonar.organization=vennu04
            -Dsonar.sources=backend/app,frontend/src
            -Dsonar.python.version=3.12

      # ── Frontend build check ──────────────────────────────────────────────
      - name: Vite build (dev sanity check)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000
